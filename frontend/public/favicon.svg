<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for the chef hat -->
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Gradient for the code brackets -->
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <!-- Drop shadow for depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Chef Hat Group -->
  <g filter="url(#glow)">
    <!-- Left Puff -->
    <circle cx="190" cy="220" r="70" fill="url(#hatGradient)" />
    <!-- Right Puff -->
    <circle cx="322" cy="220" r="70" fill="url(#hatGradient)" />
    <!-- Main Center Puff -->
    <circle cx="256" cy="170" r="85" fill="url(#hatGradient)" />
    <!-- Bottom Band -->
    <rect x="156" y="290" width="200" height="70" rx="20" fill="url(#hatGradient)" />
  </g>

  <!-- Code Brackets & Slash in high contrast center -->
  <g filter="url(#glow)">
    <!-- < Bracket -->
    <path d="M 200 240 L 160 265 L 200 290" 
          fill="none" 
          stroke="url(#codeGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- / Slash -->
    <path d="M 270 230 L 242 300" 
          fill="none" 
          stroke="url(#codeGradient)" 
          stroke-width="12" 
          stroke-linecap="round" />
          
    <!-- > Bracket -->
    <path d="M 312 240 L 352 265 L 312 290" 
          fill="none" 
          stroke="url(#codeGradient)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>